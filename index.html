<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf5f0"><title>Biraz Kendine 🌷</title><style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Nunito:wght@400;500;600;700&display=swap');
:root{--sage:#416553;--pink:#a96984;--ink:#394a41;--cream:#fffaf6}*{box-sizing:border-box}body{margin:0;background:#ece9e5;color:var(--ink);font-family:Nunito,Arial,sans-serif}.app{max-width:540px;margin:auto;min-height:100dvh;background:linear-gradient(145deg,#fffaf5,#fdf1ef 70%,#f7f2ea);box-shadow:0 0 40px #66574b20;padding-bottom:100px;position:relative;overflow:hidden}.flower{position:absolute;pointer-events:none;opacity:.33;width:115px;height:145px;background:radial-gradient(ellipse at 40% 23%,#f2c5d4 0 8%,transparent 9%),radial-gradient(ellipse at 67% 42%,#e1bfdc 0 10%,transparent 11%),radial-gradient(ellipse at 28% 59%,#fff 0 10%,transparent 11%),linear-gradient(110deg,transparent 48%,#7b9e7c 49% 50%,transparent 51%);filter:blur(.3px)}.flower.a{right:-20px;top:65px}.flower.b{left:-35px;top:260px;transform:rotate(160deg)}header{height:56px;padding:8px 18px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}button{font:inherit;cursor:pointer}header button{background:#ffffffa9;border:1px solid #e9deda;border-radius:12px;width:38px;height:38px;color:var(--sage)}.screen{padding:8px 20px 34px;position:relative;z-index:1}.hidden{display:none!important}.script{font-family:'Great Vibes','Cormorant Garamond',Georgia,serif;font-weight:400}.home-title{font-size:clamp(65px,15vw,86px);line-height:1.05;text-align:center;color:var(--sage);margin:14px 0 4px}.emoji{font:24px Arial,sans-serif;vertical-align:middle}.lead{text-align:center;font:italic 600 29px 'Cormorant Garamond',Georgia,serif;color:var(--pink);margin:8px 0}.intro{text-align:center;font:24px/1.25 'Cormorant Garamond',Georgia,serif;max-width:355px;margin:10px auto 26px}.prompt{text-align:center;font:600 26px 'Cormorant Garamond',Georgia,serif;margin:0 0 15px}.choices,.stack{display:grid;gap:11px}.choice,.tile{display:flex;gap:13px;align-items:center;width:100%;text-align:left;border:1px solid #eadbdf;background:linear-gradient(110deg,#fff8f7,#f7e6eb);border-radius:19px;padding:14px 15px;box-shadow:0 4px 14px #8f647315;color:var(--ink)}.choice:nth-child(even){background:linear-gradient(110deg,#f5f7ed,#edf3e9);border-color:#dfe8d9}.choice .ico,.tile .ico{font-size:25px;min-width:35px;text-align:center}.choice strong,.tile strong{display:block;font-size:15px;color:var(--sage)}.choice small,.tile small{display:block;font-size:12px;color:#776e71;margin-top:3px}.arrow{margin-left:auto;color:#b8879b;font-size:21px}.section-title{font:52px/1.1 'Great Vibes','Cormorant Garamond',Georgia,serif;text-align:center;color:var(--sage);margin:12px 0 3px}.section-sub{text-align:center;font:italic 24px 'Cormorant Garamond',Georgia,serif;color:var(--pink);margin:4px 0 15px}.photo{width:100%;max-height:260px;object-fit:cover;object-position:center;border-radius:22px;box-shadow:0 5px 20px #967d7d25;margin:8px 0 14px}.bodytext{font-size:14px;line-height:1.7}.panel{background:#ffffffd8;border:1px solid #f0e2e1;border-radius:19px;padding:17px;margin:12px 0;box-shadow:0 3px 13px #967d7d12}.panel h3{margin:0 0 9px;color:var(--sage);font-size:17px}.panel p{margin:6px 0;font-size:14px;line-height:1.6}.pill{border:0;border-radius:100px;background:var(--sage);color:white;padding:12px 18px;font-weight:700}.pill.secondary{background:#f3e0e8;color:#774e64}.pill.outline{background:white;border:1px solid #b9c9ba;color:var(--sage)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:13px 0}.actions button{flex:1;min-width:110px}.muted{font-size:12px;color:#7b7476}.timer{font-size:52px;font-weight:700;color:var(--sage);font-variant-numeric:tabular-nums;text-align:center;letter-spacing:2px;margin:8px}.progress{height:9px;background:#e8e6df;border-radius:20px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:linear-gradient(90deg,#9ab59e,#c999ac);transition:width .3s}.motion{background:linear-gradient(160deg,#f3f2ec,#f9e7eb);border:1px solid #ecdae2;border-radius:23px;height:220px;display:flex;justify-content:center;align-items:center;overflow:hidden}.motion svg{width:min(100%,300px);height:200px}.motion .person{stroke:#658774;stroke-width:11;fill:none;stroke-linecap:round;stroke-linejoin:round}.motion .head{fill:#e9b8b6;stroke:#658774;stroke-width:3}.motion .active{transform-origin:150px 91px;animation:sway 2.5s ease-in-out infinite alternate}.motion .arm{transform-origin:151px 88px;animation:arm 1.5s ease-in-out infinite alternate}.motion .leg{transform-origin:153px 146px;animation:step 1.1s ease-in-out infinite alternate}.motion .pulse{animation:pulse 2s ease-in-out infinite alternate}.motion.paused *{animation-play-state:paused!important}@keyframes sway{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}@keyframes arm{from{transform:rotate(-22deg)}to{transform:rotate(30deg)}}@keyframes step{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}@keyframes pulse{from{transform:translateY(-5px)}to{transform:translateY(5px)}}@media(prefers-reduced-motion:reduce){.motion *{animation:none!important}}.note{background:#eef3ed;border-left:3px solid #89a48d;padding:12px;border-radius:12px;font-size:13px;line-height:1.55;margin:12px 0}.warning{background:#fff0ee;border-left-color:#c98481}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,540px);height:72px;display:flex;justify-content:space-around;background:#fffaf8f5;backdrop-filter:blur(10px);border-top:1px solid #eadfe0;z-index:10;padding:7px 2px env(safe-area-inset-bottom)}.nav button{border:0;background:transparent;color:#6e8274;font-size:11px;min-width:65px;display:flex;flex-direction:column;align-items:center;gap:2px}.nav button span{font-size:23px}.nav button.selected{color:#b46f89;font-weight:700}.toggle{display:flex;align-items:center;gap:10px;font-size:13px;margin:10px 0}.finish{text-align:center;background:linear-gradient(160deg,#f5e8ef,#f2f6ec);padding:22px 15px;border-radius:24px}.finish h2{font:44px 'Great Vibes',Georgia,serif;color:var(--sage);margin:7px 0}.finish p{font:20px/1.3 'Cormorant Garamond',Georgia,serif}.dots{display:flex;gap:6px;justify-content:center;margin:8px}.dots i{width:9px;height:9px;border-radius:50%;background:#e3c7d2}.dots i.on{background:#9e6c83}details{background:#fff9f8;border:1px solid #ebdde0;border-radius:15px;padding:13px 15px;margin:9px 0}summary{cursor:pointer;font-weight:700;color:var(--sage)}details p,details li{font-size:13px;line-height:1.65}ul{padding-left:20px}.hide{display:none!important}
</style></head><body><div class="app"><div class="flower a"></div><div class="flower b"></div><header><button onclick="go('home')" aria-label="Ana sayfa">⌂</button><span style="color:#a67e8c;font-size:12px">🌷 Biraz Kendine</span><button onclick="go('favorites')" aria-label="Favoriler">♡</button></header><main id="main" aria-live="polite"></main><nav class="nav" aria-label="Alt menü"><button data-nav="home" onclick="go('home')"><span>⌂</span>Ana sayfa</button><button data-nav="move" onclick="go('move')"><span>♧</span>Hareket</button><button data-nav="favorites" onclick="go('favorites')"><span>♡</span>Favoriler</button><button data-nav="story" onclick="go('story')"><span>❀</span>Hikâyemiz</button></nav></div><script>
const $=s=>document.querySelector(s),main=$('#main');let page='home',interval=null,seconds=60,playing=false,step=0,round=1,plankMode='normal',motionPaused=false,restSecs=300,restRunning=false;const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};let fav=load('bk-fav',[]),sessions=load('bk-sessions',0);
const moves=[{n:'Omuzları rahatlat',t:'Omuzlarını yavaşça öne ve arkaya çevir.',kind:'arms'},{n:'Yerinde yürüyüş',t:'Rahat tempoda yerinde yürü; nefesini tutma.',kind:'legs'},{n:'Kolları uzat',t:'Kollarını öne doğru uzatıp yavaşça gevşet.',kind:'arms'},{n:'Yana esne',t:'Gövdeni hafifçe sağa ve sola eğ; zorlamadan.',kind:'body'},{n:'El ve bilekleri gevşet',t:'Ellerini aç-kapat, bileklerini yavaşça döndür.',kind:'arms'},{n:'Yan adımlar',t:'Sağa ve sola küçük, kontrollü adımlar at.',kind:'legs'},{n:'Sandalyeden kalk ve otur',t:'Sağlam bir sandalyeden destek alarak yavaşça kalk ve otur.',kind:'legs'},{n:'Hafif diz kaldırma',t:'Denge için duvardan destek alarak dizlerini sırayla hafifçe kaldır.',kind:'legs'},{n:'Duvara hafif itiş',t:'Ellerini duvara koy, dirseklerini hafifçe büküp doğrul.',kind:'arms'},{n:'Yavaş yürü ve gevşe',t:'Yavaş adımlarla hareket et, omuzlarını serbest bırak.',kind:'legs'}];
function stop(){if(interval)clearInterval(interval);interval=null;playing=false;restRunning=false}function clock(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function shell(title,sub,content){return `<section class="screen"><h1 class="section-title">${title}</h1>${sub?`<p class="section-sub">${sub}</p>`:''}${content}</section>`}function btn(label,fn,cl='pill'){return `<button class="${cl}" onclick="${fn}">${label}</button>`}function tile(icon,title,desc,id){return `<button class="choice" onclick="go('${id}')"><span class="ico">${icon}</span><span><strong>${title}</strong><small>${desc}</small></span><span class="arrow">›</span></button>`}function go(p){stop();if(p==='plank')seconds=60;if(p==='rest')restSecs=300;page=p;window.scrollTo(0,0);render()}function render(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('selected',b.dataset.nav===page));let out='';switch(page){case'home':out=`<section class="screen"><h1 class="script home-title">Biraz Kendine <span class="emoji">🥹</span></h1><p class="lead">Biraz yoruldun, biliyorum...</p><p class="intro">Her şeyi bir anlığına bırak. Gel, birkaç dakikayı da kendimize ayıralım.</p><h2 class="prompt">Şu an sana ne iyi gelir?</h2><div class="choices">${tile('🌿','Çok bunaldım','Biraz sakinleşmek istiyorum','calm')}${tile('☕','Biraz dinlenmek','Kendime kısa bir mola','rest')}${tile('🌷','Biraz hareket etmek','5 veya 10 dakikalık nazik hareketler','move')}${tile('🪞','Kendime bakım','Bugün kendim için küçük bir şey','care')}${tile('🍼','Bebeğim güvende','Güvenli ilk kontroller','baby')}${tile('💗','Hikâyemiz','Bu uygulama neden var?','story')}</div><p class="muted" style="text-align:center;margin-top:17px">Küçük bir mola da değerlidir. 🌸</p></section>`;break;
case'move':out=shell('Biraz hareket etmek','5 dakika senin için, istersen 5 dakika daha',`<div class="panel"><h3>🌷 5 Dakikada Kendime Geliyorum</h3><p>Japonların kısa hareket molalarından ilham alan, herkesin kendi temposuna uyarlayabileceği nazik bir seri. İlk 5 hareketin her biri 1 dakika.</p><p>İstersen ikinci 5 dakikaya devam edebilirsin. En sonda isteğe bağlı plank bonusu var.</p><div class="actions">${btn('▶ İlk 5 dakikayı başlat','startMoves(1)')}</div></div><div class="panel"><h3>İlk 5 hareket</h3>${moves.slice(0,5).map((m,i)=>`<p>${i+1}. <b>${m.n}</b> — ${m.t}</p>`).join('')}</div><div class="panel"><h3>İstersen 5 dakika daha</h3>${moves.slice(5).map((m,i)=>`<p>${i+6}. <b>${m.n}</b> — ${m.t}</p>`).join('')}<div class="actions">${btn('İkinci bölümü başlat','startMoves(2)','pill secondary')}</div></div><div class="note">Ağrı, baş dönmesi veya nefes darlığı olursa hareketi bırak. Hareketleri kendi rahatlığına göre uyarlayabilirsin.</div>`);break;
case'exercise':out=exerciseHTML();break;
case'rounddone':out=shell('Kendine iyi geldin','Beş dakikan tamamlandı',`<div class="finish"><h2>İyi ki kendine zaman ayırdın 🌷</h2><p>Bugün kendin için güzel bir adım attın. Daha fazla yapmak zorunda değilsin.</p></div><div class="actions">${round===1?btn('🌸 5 dakika daha','startMoves(2)'):btn('🌷 Plank bonusunu dene','go(\'plank\')')}${btn('Bugünlük bu kadar','completeSession()','pill secondary')}</div>${round===1?`<div class="actions">${btn('İstersen plank bonusuna geç','go(\'plank\')','pill outline')}</div>`:''}`);break;
case'plank':out=plankHTML();break;
case'congrats':out=shell('Kendine teşekkür et','Bu an yalnızca sana aitti',`<div class="finish"><div style="font-size:35px">🌷 💗 🌸</div><h2>Başardın, güzel kadın!</h2><p><em>Bugün kendin için bir şey yaptın...</em></p><p>Belki sadece birkaç dakikaydı ama o dakikalar tamamen sana aitti.</p><p>Ne kadar dayanabildiğinin bir önemi yok. Önemli olan kendine zaman ayırman, denemen ve kendini önemsemen.</p><p><b>İyi ki kendine bu zamanı ayırdın. 💗</b></p></div><div class="actions">${btn('Ana sayfaya dön','go(\'home\')')}${btn('Yeniden hareket et','go(\'move\')','pill secondary')}</div>`);break;
case'rest':out=restHTML();break;
case'calm':out=shell('Çok bunaldım','Önce kendine nazik davran',`<div class="panel"><h3>🌿 İki dakikalık sakinleşme molası</h3><p>1. Mümkünse sessiz bir yere geç ve ayaklarını yere bas.</p><p>2. Omuzlarını gevşet. Nefesini zorlamadan, doğal ritminde alıp ver.</p><p>3. Çevrende gördüğün üç şeyi fark et.</p><p>4. Ellerini yıka veya bir bardak su iç.</p><p>5. Kendine şunu söyle: “Her şeyi aynı anda çözmek zorunda değilim.”</p></div><div class="actions">${btn('☕ Biraz dinlenmek istiyorum','go(\'rest\')')}</div><div class="note">Çok bunalmış hissettiğinde güvendiğin biriyle konuşmak da iyi gelebilir.</div>`);break;
case'care':out=shell('Kendime bakım','Küçük bir şey bile yeter',`<div class="panel"><h3>🪞 Cilt bakımı — 3 dakika</h3><p>Yüzünü nazikçe temizle. Cildine uygun nemlendiricini sür. Gündüzse güneş koruyucunu unutma.</p></div><div class="panel"><h3>🌷 Saç bakımı — 3 dakika</h3><p>Saçını uçlardan başlayarak nazikçe tara. Saç derisini tırnaklarınla değil, parmak uçlarınla hafifçe rahatlat.</p></div><div class="panel"><h3>🧴 El ve tırnak bakımı — 2 dakika</h3><p>Ellerini temizleyip kurula, el kremi sür. Tırnak etlerini koparmadan bakım yap.</p></div><div class="panel"><h3>☕ Kendime vakit</h3><p>Bir bardak su iç, pencereyi aç veya sevdiğin bir şarkının kısa bir bölümünü dinle. Hepsini yapmak zorunda değilsin.</p></div><div class="actions">${btn('♡ Bu bölümü favorile','favorite(\'care\')','pill secondary')}</div>`);break;
case'baby':out=shell('Bebeğim güvende','Sevgiyle, güvenle, adım adım',`<img class="photo" src="anne-bebek.png" alt="Anne ve bebeğin çiçekli fotoğrafı"><p class="bodytext">Bebek ağladığında önce temel ihtiyaçlarını sakinlikle kontrol edebilirsin. Bu bilgiler sağlık uzmanının değerlendirmesinin yerini tutmaz.</p><details open><summary>🍼 Temel kontroller</summary><p>Açlık, ıslak bez, fazla sıcak/soğuk ortam, gaz, uyku ihtiyacı veya rahatsız eden giysileri kontrol et.</p></details><details><summary>💗 Sakinleştirme yöntemleri</summary><p>Bebeği güvenle kucağına al, yumuşak sesle konuş, nazikçe sallanmadan ritmik biçimde sakinleştir. Bunaldığında bebeği sırtüstü güvenli yatağına koyup kısa süre yardım isteyebilirsin. Bebeği asla sarsma.</p></details><details><summary>🌙 Güvenli uyku</summary><p>Her uykuda sırtüstü yatır; sert ve düz yatak kullan. Yastık, gevşek battaniye, oyuncak ve yumuşak nesneleri uyku alanından uzak tut. Bebek için ayrı, güvenli uyku yüzeyi tercih et.</p></details><details><summary>🤱 Beslenme desteği</summary><p>Açlık işaretlerini takip et. Emzirme veya beslenme güçlüğü, yetersiz ıslak bez ya da kilo alımı endişesinde sağlık profesyonelinden destek al.</p></details><details><summary>🩺 Ne zaman yardım almalıyım?</summary><p>Solunum güçlüğü, morarma, zor uyandırılma, nöbet veya ciddi hastalık belirtisinde acil yardım iste (Türkiye'de 112). Üç aydan küçük bebekte 38°C veya üzeri ateş varsa gecikmeden tıbbi değerlendirme gerekir. Beslenememe, susuzluk belirtileri veya alışılmadık, durdurulamayan ağlama için sağlık uzmanına başvur.</p></details><div class="note warning">Bebeğinin iyi olmadığını düşünüyorsan bu uygulamadaki önerilerle bekleme; sağlık kuruluşuna başvur.</div>`);break;
case'story':out=shell('Hikâyemiz','Bir kadından başka kadınlara',`<img class="photo" src="aile.png" alt="Anne ve çocukların çiçeklerle çevrili aile fotoğrafı"><div class="panel"><p>“Biraz Kendine”, gün içinde herkese yetişmeye çalışırken kendine birkaç dakika ayırmak isteyenler için doğdu.</p><p>Burada kusursuz olmaya çalışmıyoruz. Sadece küçük bir nefes, nazik bir hareket ve kendimize ayrılmış minicik bir an buluyoruz.</p><p><b>İyi ki buradasın. 🌷</b></p></div>`);break;
case'favorites':out=shell('Favorilerim','Sana iyi gelen küçük anlar',`<div class="panel"><h3>💗 Kaydettiklerin</h3>${fav.length?fav.map(x=>`<p><button class="pill secondary" onclick="go('${x}')">${({care:'Kendime bakım',move:'Biraz hareket etmek',rest:'Biraz dinlenmek'})[x]||x} →</button></p>`).join(''):'<p>Henüz favorin yok. Sevdiğin bölümlerdeki ♡ düğmesini kullanabilirsin.</p>'}</div><div class="panel"><h3>🌸 Kendime ayırdığım molalar</h3><p>Bu cihazda tamamlanan hareket molaları: <b>${sessions}</b></p></div>`);break;default:out='';}main.innerHTML=out;}
function favorite(x){fav=fav.includes(x)?fav.filter(y=>y!==x):[...fav,x];store('bk-fav',fav);alert(fav.includes(x)?'Favorilerine eklendi 💗':'Favorilerden çıkarıldı');}function completeSession(){sessions++;store('bk-sessions',sessions);go('congrats')}
function figure(kind='arms',knees=false){if(kind==='plank')return `<svg viewBox="0 0 320 200" role="img" aria-label="${knees?'Dizler yerde':'Normal'} plank duruşunu gösteren çizim"><path d="M28 164H296" stroke="#b5b8a8" stroke-width="3"/><g class="pulse"><circle cx="79" cy="99" r="15" class="head"/><path class="person" d="M94 108 L145 121 L211 ${knees?137:127} L${knees?228:273} ${knees?162:161} M142 120 L129 159 L111 159 M211 ${knees?137:127} L${knees?228:273} 161"/></g><text x="160" y="188" text-anchor="middle" fill="#708475" font-size="12">${knees?'Dizler yerde plank':'Normal plank'}</text></svg>`;return `<svg viewBox="0 0 320 200" role="img" aria-label="Hareketi gösteren tekrarlayan çizim"><ellipse cx="160" cy="187" rx="75" ry="6" fill="#d6d8c8"/><g class="${kind==='body'?'active':'pulse'}"><circle cx="150" cy="48" r="20" class="head"/><path class="person" d="M150 71 L151 138"/><path class="person arm" d="M150 88 L109 112 M150 88 L191 112"/><path class="person leg" d="M151 138 L124 180 M151 138 L180 180"/></g><path d="M55 83 Q36 111 56 136 M266 83 Q285 111 266 136" fill="none" stroke="#bfa5ba" stroke-width="3" stroke-dasharray="5 6"/></svg>`}
function startMoves(r){stop();round=r;step=(r-1)*5;seconds=60;playing=false;page='exercise';render();}function exerciseHTML(){const m=moves[step];return shell('Biraz hareket','Kendine ayırdığın bu an değerli',`<div class="panel"><p class="muted">${round}. bölüm • Hareket ${step%5+1} / 5</p><h3>${m.n}</h3><p>${m.t}</p><div id="motion" class="motion ${motionPaused?'paused':''}">${figure(m.kind)}</div><p class="muted" style="text-align:center">Sessiz, tekrar eden çizim • Dilersen durdur</p><div class="timer" id="timer">${clock(seconds)}</div><div class="progress"><div id="bar" style="width:${(60-seconds)/60*100}%"></div></div><div class="actions">${btn(playing?'⏸ Duraklat':'▶ Başlat','toggleExercise()')}${btn('Sonraki →','nextExercise()','pill secondary')}</div><div class="actions">${btn('Animasyonu '+(motionPaused?'oynat':'durdur'),'toggleMotion()','pill outline')}${btn('Bitir','go(\'move\')','pill outline')}</div></div><div class="note">Her hareket 1 dakika. Zorlanırsan durabilir, atlayabilir veya daha yavaş yapabilirsin.</div>`)}function toggleMotion(){motionPaused=!motionPaused;const el=$('#motion');if(el)el.classList.toggle('paused',motionPaused)}function toggleExercise(){if(playing){stop();render();return}playing=true;render();interval=setInterval(()=>{seconds--;const t=$('#timer'),b=$('#bar');if(t)t.textContent=clock(Math.max(0,seconds));if(b)b.style.width=(60-seconds)/60*100+'%';if(seconds<=0)nextExercise()},1000)}function nextExercise(){stop();if(step%5===4){page='rounddone';render()}else{step++;seconds=60;page='exercise';render();toggleExercise()}}
function plankHTML(){return shell('Son bir dakika','Bir dakika hedefimiz, kendini iyi hissetmen önceliğimiz',`<div class="panel"><h3>🌷 Plank bonusu</h3><p>60 saniyelik sayaç hazır. İstediğin an bırakabilirsin; süreyi bitirmek zorunda değilsin.</p><div class="actions">${btn('Normal plank',"setPlank('normal')",plankMode==='normal'?'pill':'pill secondary')}${btn('Dizler yerde',"setPlank('knees')",plankMode==='knees'?'pill':'pill secondary')}</div><div class="motion" id="motion">${figure('plank',plankMode==='knees')}</div><p class="muted" style="text-align:center">Duruşu anlatan şematik çizim • Nefesini tutma</p><div class="timer" id="timer">${clock(seconds)}</div><div class="progress"><div id="bar" style="width:${(60-seconds)/60*100}%"></div></div><div class="actions">${btn(playing?'⏸ Duraklat':'▶ Başlat','togglePlank()')}${btn('İstediğim an bitir','finishPlank()','pill secondary')}</div><div class="note">🌷 <b>Zorlanıyor musun?</b> Dizlerini yere koyarak devam edebilirsin. Belini zorlamadan, nefesini tutmadan yap. Ağrı hissedersen bırak.</div></div><div class="actions">${btn('Plank yapmadan bitir','completeSession()','pill outline')}</div>`)}function setPlank(v){stop();plankMode=v;render()}function togglePlank(){if(playing){stop();render();return}playing=true;render();interval=setInterval(()=>{seconds--;const t=$('#timer'),b=$('#bar');if(t)t.textContent=clock(Math.max(0,seconds));if(b)b.style.width=(60-seconds)/60*100+'%';if(seconds<=0)finishPlank()},1000)}function finishPlank(){stop();completeSession()}
function restHTML(){return shell('Biraz dinlenmek','Birkaç dakika sadece sana ait',`<div class="panel"><h3>☕ Beş dakikalık nazik mola</h3><p>1. Rahat bir yere otur ve omuzlarını gevşet.</p><p>2. Nefesini zorlamadan yavaşça alıp ver.</p><p>3. Ellerini ve çeneni rahat bırak.</p><p>4. Çevrendeki sesleri fark et; hiçbir şeyi çözmek zorunda değilsin.</p><p>5. Hazır olduğunda güne kendi hızında dön.</p><div class="timer" id="timer">${clock(restSecs)}</div><div class="progress"><div id="bar" style="width:${(300-restSecs)/300*100}%"></div></div><div class="actions">${btn(restRunning?'⏸ Duraklat':'▶ Molayı başlat','toggleRest()')}${btn('Sıfırla','resetRest()','pill secondary')}</div></div><div class="actions">${btn('♡ Favorilere ekle','favorite(\'rest\')','pill outline')}</div>`)}function toggleRest(){if(restRunning){stop();render();return}restRunning=true;render();interval=setInterval(()=>{restSecs--;if($('#timer'))$('#timer').textContent=clock(Math.max(0,restSecs));if($('#bar'))$('#bar').style.width=(300-restSecs)/3+'%';if(restSecs<=0){stop();restSecs=300;alert('Kendine ayırdığın bu an değerli 🌷');render()}},1000)}function resetRest(){stop();restSecs=300;render()}
render();</script></body></html>
