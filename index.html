<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fbf5ef"><title>Biraz Kendine 🌷</title><style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Nunito:wght@400;500;600;700;800&display=swap');
:root{--ink:#244c3c;--pink:#b9768c;--cream:#fff9f3;--line:#eaded9}*{box-sizing:border-box}body{margin:0;background:#eee9e4;color:#293b34;font-family:Nunito,Arial,sans-serif}.app{position:relative;max-width:510px;min-height:100dvh;margin:auto;background:linear-gradient(155deg,#fffaf5,#fdf2ed 60%,#f7f0e9);box-shadow:0 0 32px #6b51401b;padding-bottom:88px;overflow:hidden}.flowers{pointer-events:none;position:absolute;z-index:0;width:205px;opacity:.88;filter:saturate(.92)}.flowers.a{top:-70px;right:-68px;transform:rotate(18deg)}.flowers.b{left:-90px;top:170px;transform:rotate(-40deg)}.flowers.c{right:-115px;bottom:65px;transform:rotate(30deg)}main,header,nav{position:relative;z-index:1}header{height:55px;display:flex;justify-content:space-between;align-items:center;padding:8px 18px}button{font:inherit;cursor:pointer}header button{border:0;background:#ffffff8a;color:var(--ink);font-size:22px;border-radius:12px;width:38px;height:38px}.screen{padding:4px 21px 28px}.hidden{display:none!important}.script{font-family:'Great Vibes','Cormorant Garamond',Georgia,serif;font-weight:400;letter-spacing:.3px}.home-title{font-size:clamp(64px,16vw,89px);line-height:.95;text-align:center;color:var(--ink);margin:22px 0 10px}.home-title .emoji{font-family:Arial;font-size:29px;vertical-align:middle}.lead{text-align:center;color:#c2768b;font-family:'Cormorant Garamond',Georgia,serif;font-size:29px;font-style:italic;font-weight:600;margin:8px 0}.intro{text-align:center;font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;line-height:1.18;margin:10px auto 24px;max-width:330px}.prompt{text-align:center;font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;font-weight:600;background:#fffcf8dc;border-radius:24px;padding:10px;box-shadow:0 3px 15px #ae8a7921;margin:0 0 14px}.choices{display:grid;gap:10px}.choice{display:flex;align-items:center;text-align:left;gap:12px;width:100%;min-height:67px;border:1px solid #f0e0db;background:linear-gradient(100deg,#f8e9e8e8,#fff9f5ed);border-radius:21px;padding:10px 13px;box-shadow:0 3px 10px #ab8c8514;color:#253e33}.choice:nth-child(2n){background:linear-gradient(100deg,#e8f0e8ed,#fff8f5ed)}.choice .ico{font-size:31px;width:40px;text-align:center}.choice strong{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;line-height:1}.choice small{display:block;font-size:12px;margin-top:5px}.choice .arrow{margin-left:auto;font-size:22px;color:#a26f7c}.section-title{text-align:center;font-size:55px;line-height:1.05;color:var(--ink);margin:10px 0 3px}.subtitle{text-align:center;font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-style:italic;margin:0 0 16px}.hero{width:100%;height:245px;object-fit:cover;border-radius:23px;box-shadow:0 7px 25px #725b4c24}.hero.baby{height:285px;object-position:center 38%}.hero.family{height:260px;object-position:center 30%}.bodycopy{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;line-height:1.2;margin:16px 2px}.panel{background:#fffaf4d9;border:1px solid #eddeda;border-radius:23px;padding:15px;box-shadow:0 4px 15px #7b5b4d13;margin-top:12px}.panel h3{margin:0 0 12px;color:var(--ink);font-size:18px}.item{width:100%;border:0;border-bottom:1px solid #eadfda;background:transparent;display:flex;gap:12px;align-items:center;text-align:left;padding:13px 3px;color:#293d32}.item:last-child{border-bottom:0}.item .ico{font-size:28px;width:38px;text-align:center}.item strong{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;display:block}.item small{font-size:12px;display:block}.item .arrow{margin-left:auto}.steps{padding-left:23px;line-height:1.6}.steps li{padding:5px 0}.action{width:100%;border:0;border-radius:28px;padding:15px 18px;background:#4f866c;color:white;font-size:17px;margin-top:16px}.secondary{background:#f5e4e8;color:#6c4050}.back{border:0;background:transparent;color:var(--ink);font-size:14px;padding:0 0 12px}.timer{text-align:center;font-size:42px;color:var(--ink);font-weight:800;margin:16px}.muted{font-size:13px;color:#655d5b;line-height:1.5}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:510px;width:100%;display:flex;justify-content:space-around;background:#fffaf6f5;border-top:1px solid #eadcd6;border-radius:20px 20px 0 0;box-shadow:0 -5px 18px #a88a7a22;padding:8px 2px max(8px,env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:#566459;font-size:11px;min-width:62px}.nav span{display:block;font-size:23px}.nav .active{color:#287451;font-weight:800}.pill{display:inline-block;background:#f8e7ed;color:#935b72;padding:7px 11px;border-radius:20px;font-size:12px}.fave{float:right;border:0;background:#fff5f5;color:#b85d78;border-radius:50%;font-size:24px;width:39px;height:39px}.note{background:#fdf0eb;padding:12px;border-radius:14px;font-size:13px;line-height:1.5}.center{text-align:center}.decor{width:100%;height:155px;object-fit:cover;object-position:center;border-radius:22px;margin:6px 0 10px}a{color:#376b52}@media(min-width:600px){.app{min-height:100vh}}
</style></head><body><div class="app"><img class="flowers a" src="frezyalar.png" alt=""><img class="flowers b" src="frezyalar.png" alt=""><img class="flowers c" src="frezyalar.png" alt=""><header><button id="menu" aria-label="Ana sayfa">☰</button><button id="heart" aria-label="Favoriler">♡</button></header><main id="main" aria-live="polite"></main><nav class="nav" id="nav"><button data-page="home"><span>⌂</span>Ana sayfa</button><button data-page="favorites"><span>♡</span>Favoriler</button><button data-page="story"><span>✿</span>Hikâyemiz</button><button data-page="info"><span>☷</span>Bilgi</button></nav></div><script>
'use strict';const main=document.getElementById('main');const items=[['calm','🌿','Biraz sakinleşmek','Zihnini rahatlat'],['rest','☕','Biraz dinlenmek','Kendime kısa bir mola'],['move','🌱','Biraz hareket etmek','Kısa ve nazik hareketler'],['care','💗','Kendime bakım','Bugün kendim için küçük bir şey'],['baby','🤱','Bebeğim güvende','Sağlıklı, mutlu ve huzurlu'],['info','📖','Bilgi köşesi','Sana iyi gelecek bilgiler'],['story','🌸','Hikâyemiz','Küçük anlar, büyük mutluluklar']];let page='home',timer=null,remaining=300;let favorites=[];try{favorites=JSON.parse(localStorage.getItem('bk-favs')||'[]')}catch{}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function choice(i){return `<button class="choice" data-go="${i[0]}"><span class="ico">${i[1]}</span><span><strong>${i[2]}</strong><small>${i[3]}</small></span><span class="arrow">›</span></button>`}function subitems(arr){return `<div class="panel">${arr.map(x=>`<button class="item" data-detail="${esc(x[0])}"><span class="ico">${x[1]}</span><span><strong>${x[0]}</strong><small>${x[2]}</small></span><span class="arrow">›</span></button>`).join('')}</div>`}function section(title,subtitle,content){return `<section class="screen"><button class="back" data-go="home">‹ Ana sayfaya dön</button><button class="fave" data-fave="${page}" aria-label="Favorilere ekle">${favorites.includes(page)?'♥':'♡'}</button><h1 class="script section-title">${title}</h1><p class="subtitle">${subtitle}</p>${content}</section>`}function render(p){if(timer){clearInterval(timer);timer=null}page=p;let h='';if(p==='home')h=`<section class="screen"><h1 class="script home-title">Biraz<br>Kendine <span class="emoji">🥹</span></h1><p class="lead">Biraz yoruldun, biliyorum...</p><p class="intro">Her şeyi bir anlığına bırak. Gel, birkaç dakikayı da kendimize ayıralım.</p><div class="prompt">Şu an sana ne iyi gelir?</div><div class="choices">${items.map(choice).join('')}</div></section>`;else if(p==='baby')h=section('Bebeğim güvende','Sağlıklı, mutlu ve huzurlu',`<img class="hero baby" src="anne-bebek.png" alt="Anne ve yenidoğan bebek"><p class="bodycopy">Bebeğinin ihtiyaçlarını anlamak bazen zor gelebilir. Burada günlük bakım ve güvenli ilk kontroller için kısa bilgiler bulabilirsin.</p>${subitems([['Temel bakım','🍼','Beslenme, bez, rahatlık'],['Uyku güvenliği','🌙','Güvenli uyku önerileri'],['Bebek sağlığı','💗','Dikkat edilmesi gereken belirtiler'],['Sakinleştirme','🎵','Nazik yöntemler'],['Emzirme desteği','🤱','Kısa hatırlatmalar']])}<p class="note">Acil durumlarda bu uygulamaya güvenerek bekleme. Nefes alma güçlüğü, morarma, tepkisizlik gibi belirtilerde 112'yi ara. Üç aydan küçük bebekte 38°C veya üzeri ateş için acilen sağlık değerlendirmesi gerekir.</p>`);else if(p==='story')h=section('Hikâyemiz','Küçük anlar, büyük mutluluklar...',`<img class="hero family" src="aile.png" alt="Anne ve üç çocuk, çiçeklerle çevrili"><p class="bodycopy center">Yoğun hayatın içinde bile sevdiklerimizle paylaştığımız küçük anlar bize güç verir.</p>${subitems([['Küçük mutluluklar','🌸','Günlük güzel anlar'],['Kendime notlar','📔','Küçük hatırlatmalar']])}`);else if(p==='rest')h=section('Biraz dinlenmek','Kendime kısa bir mola',`<img class="decor" src="frezyalar.png" alt="Pastel frezyalar"><p class="bodycopy">Yorucu bir günün içindesin... Sadece beş dakikayı kendine ayırabilirsin.</p><div class="panel"><h3>🌿 5 dakikalık rahatlama rutini</h3><ol class="steps"><li>Rahat ve güvenli bir yer bul.</li><li>Nefesini zorlamadan yavaşça alıp ver.</li><li>Yüzünü yıka veya bir yudum su iç.</li><li>Omuzlarını ve ellerini gevşet.</li><li>Bir anlığına sadece kendine odaklan.</li></ol></div><div id="clock" class="timer">05:00</div><button class="action" data-timer="start">▶ 5 dakikayı başlat</button><button class="action secondary" data-timer="reset">Sıfırla</button>`);else if(p==='move')h=section('Biraz hareket etmek','Kısa ve nazik hareketler',`<p class="bodycopy">Küçük hareketler günün içinde iyi hissetmene yardımcı olabilir. Kendini zorlamadan, sana uygun olanı seç.</p>${subitems([['Sabah hafif hareketler','🌿','Yumuşak bir başlangıç'],['Gün içinde kısa molalar','☀️','Evde veya işte'],['Esneme ve rahatlama','🧘','Nazik hareketler'],['Kısa yürüyüş','🚶','Temiz hava ve mola']])}`);else if(p==='care')h=section('Kendime bakım','Bugün kendim için küçük bir şey',`<p class="bodycopy">Kendine iyi bakmak lüks değil. Küçük bir adım bile gününü güzelleştirebilir.</p>${subitems([['Cilt bakımı','🧴','Kısa ve pratik öneriler'],['Saç bakımı','🌷','Nazik bakım rutinleri'],['Tırnak ve el bakımı','💅','Küçük dokunuşlar'],['Kendime vakit ayırma','💌','Beş dakikalık fikirler']])}`);else if(p==='calm')h=section('Biraz sakinleşmek','Şu an sadece kendine dön',`<p class="bodycopy">Her şeyi hemen çözmek zorunda değilsin. Birkaç dakika boyunca kendine nazik davranabilirsin.</p><div class="panel"><h3>🌿 Küçük bir mola</h3><ol class="steps"><li>Ayaklarının yere temasını hisset.</li><li>Omuzlarını rahat bırak.</li><li>Etrafında gördüğün üç şeyi fark et.</li><li>Bir bardak su iç veya pencereyi aç.</li><li>Hazır olduğunda gününe dön.</li></ol></div><button class="action" data-go="rest">5 dakikalık molaya geç</button>`);else if(p==='info')h=section('Bilgi köşesi','Sana iyi gelecek bilgiler',subitems([['Anne ve bebek','🍼','Günlük güvenli bakım'],['Dinlenme ve uyku','🌙','Kısa öneriler'],['Kendine iyi davranmak','💗','Küçük hatırlatmalar']]));else if(p==='favorites')h=section('Favorilerim','İyi gelenlere kolayca dön',favorites.length?`<div class="choices">${items.filter(i=>favorites.includes(i[0])).map(choice).join('')}</div>`:'<p class="bodycopy center">Henüz favorin yok. Sevdiğin bölümdeki ♡ simgesine dokunabilirsin.</p>');else if(p.startsWith('detail:')){let name=p.slice(7);h=section(name,'Küçük, güvenli hatırlatmalar',`<div class="panel"><p class="bodycopy">${detailText(name)}</p></div><button class="action secondary" data-go="home">Ana sayfaya dön</button>`)}main.innerHTML=h;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));window.scrollTo(0,0)}function detailText(name){const m={'Temel bakım':'Bebeğinin açlık, bez, ortam sıcaklığı ve rahatlık ihtiyacını kontrol et. Ağlaması sürüyorsa sağlık uzmanına danış.','Uyku güvenliği':'Bebeği her uyku için sırtüstü, sert ve düz bir yatağa yatır. Uyku alanında yastık, gevşek battaniye ve oyuncak bulundurma.','Bebek sağlığı':'Nefes alma güçlüğü, morarma veya tepkisizlik acildir: 112. Üç aydan küçük bebekte 38°C ve üzeri ateş acil değerlendirme gerektirir.','Sakinleştirme':'Bebeğini güvenle kucağına al, yumuşak sesle konuş ve ihtiyacını kontrol et. Bebeği asla sarsma. Çok bunaldıysan bebeği güvenli yatağına bırakıp kısa bir mola ver.','Emzirme desteği':'Emzirme sırasında rahat bir pozisyon bul. Ağrı, yeterli beslenememe veya kilo alımıyla ilgili endişelerde ebe ya da sağlık uzmanından destek al.'};return m[name]||'Kendine uygun, küçük ve nazik bir adım seç. Rahatsızlık veya ağrı hissedersen dur. Gerektiğinde bir uzmandan destek al.'}document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go)render(b.dataset.go);else if(b.dataset.page)render(b.dataset.page);else if(b.dataset.detail)render('detail:'+b.dataset.detail);else if(b.dataset.fave){const v=b.dataset.fave;favorites=favorites.includes(v)?favorites.filter(x=>x!==v):[...favorites,v];try{localStorage.setItem('bk-favs',JSON.stringify(favorites))}catch{}b.textContent=favorites.includes(v)?'♥':'♡'}else if(b.dataset.timer==='reset'){if(timer)clearInterval(timer);timer=null;remaining=300;document.getElementById('clock').textContent='05:00'}else if(b.dataset.timer==='start'){if(timer)return;const btn=b;btn.textContent='Mola devam ediyor…';timer=setInterval(()=>{remaining--;const c=document.getElementById('clock');if(!c){clearInterval(timer);timer=null;return}c.textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;if(remaining<=0){clearInterval(timer);timer=null;btn.textContent='🌷 Molan tamamlandı';}},1000)}});document.getElementById('menu').onclick=()=>render('home');document.getElementById('heart').onclick=()=>render('favorites');render('home');
</script></body></html>
